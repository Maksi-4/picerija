<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        Prijava | Pizzerija Pet zvezd
    </title>
    <link href="style.css" rel="stylesheet" />
    <script defer="" src="script.js">
    </script>
</head>

<body>
    <header>
        <a class="brand" href="index.html">
            🍕 PET ZVEZD
            <small>
                PIZZERIJA
            </small>
        </a>
        <nav>
            <a href="index.html">
                Domov
            </a>
            <a href="onas.html">
                O nas
            </a>
            <a href="meni.html">
                Meni
            </a>
            <a href="galerija.html">
                Galerija
            </a>
            <a href="kontakt.html">
                Kontakt
            </a>
        </nav>
        <div class="actions">
            <a class="btn secondary" href="prijava.html" id="account">
                Prijava
            </a>
            <a class="btn" href="narocilo.html">
                Košarica (
                <span id="count">
                    0
                </span>
                )
            </a>
        </div>
    </header>
    <main>
        <section class="panel" id="auth">
            <h2 id="authTitle">
                Prijava
            </h2>
            <form id="authForm">
                <input id="email" placeholder="E-pošta" required="" type="email" />
                <input id="password" minlength="6" placeholder="Geslo (vsaj 6 znakov)" required="" type="password" />
                <button id="authSubmit">
                    Prijavi se
                </button>
                <p id="authStatus" role="status">
                </p>
            </form>
            <button class="secondary" id="toggleAuth">
                Ustvari račun
            </button>
            <p class="muted">
                Demo račun velja samo v tem brskalniku. Ne uporabljaj pravega gesla.
            </p>
        </section>
    </main>
    <footer>
        ★★★★★ · Pizzerija Pet zvezd · Demo spletna stran
    </footer>
</body>

</html>
